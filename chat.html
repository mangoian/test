<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB손해보험 디자인 봇</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #e8eaf0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* ── App Shell ── */
    .app {
      width: 390px;
      height: 780px;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, #c8dff5 0%, #dcd8f0 30%, #e8d4e8 55%, #dce8f0 80%, #d0e8e4 100%);
      box-shadow: 0 32px 80px rgba(0,0,0,0.22);
      position: relative;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 12px;
      flex-shrink: 0;
    }
    .header-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      color: #333;
      font-size: 20px;
    }
    .header-btn:hover { background: rgba(255,255,255,0.4); }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .header-title span {
      font-size: 11px;
      font-weight: 400;
      color: #999;
      margin-left: 4px;
    }

    /* ── Screens ── */
    .screen {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .screen.hidden { display: none; }

    /* ── Intro Screen ── */
    #intro-screen {
      padding: 24px 24px 32px;
      overflow-y: auto;
    }
    .greeting {
      margin-bottom: 36px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease forwards 0.1s;
    }
    .greeting h2 {
      font-size: 28px;
      font-weight: 900;
      color: #1a1a1a;
      line-height: 1.35;
    }
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .faq-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border: none;
      border-radius: 20px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      cursor: pointer;
      text-align: left;
      font-family: 'Noto Sans KR', sans-serif;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      opacity: 0;
      transform: translateY(14px);
    }
    .faq-btn.animate-in {
      animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .faq-btn:hover { transform: scale(1.015); box-shadow: 0 4px 18px rgba(0,0,0,0.1); }
    .faq-btn:active { transform: scale(0.98); }
    .faq-btn .icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
    .faq-btn .label { font-size: 15px; font-weight: 500; color: #1a1a1a; }

    /* ── Chat Screen ── */
    #chat-screen { display: none; flex-direction: column; }
    #chat-screen.active { display: flex; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .messages::-webkit-scrollbar { width: 0; }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.35s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #00913A;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      color: white;
    }

    .bubble {
      padding: 14px 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(10px);
      max-width: 84%;
      font-size: 13px;
      color: #1a1a1a;
      line-height: 1.6;
    }
    .msg-row.user .bubble {
      max-width: 70%;
      border-bottom-right-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    .msg-row.bot .bubble { border-bottom-left-radius: 6px; }

    /* ── Bottom chip bar ── */
    .chip-bar {
      padding: 12px 16px 24px;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.6);
      flex-shrink: 0;
    }
    .chip-bar p { font-size: 11px; color: #aaa; margin-bottom: 8px; padding-left: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      font-size: 12px; font-weight: 500; color: #333;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: transform 0.15s, opacity 0.15s;
    }
    .chip:hover { transform: scale(1.04); }
    .chip:active { transform: scale(0.97); }
    .chip.used {
      background: rgba(255,255,255,0.35);
      border-color: rgba(200,200,200,0.3);
      color: #bdbdbd;
      box-shadow: none;
      cursor: default;
      pointer-events: none;
    }

    /* ── Answer content styles ── */
    .ans { font-size: 13px; color: #555; line-height: 1.7; }
    .ans .desc { margin-bottom: 12px; font-size: 13px; color: #666; line-height: 1.65; }
    .ans strong { color: #1a1a1a; }

    .color-cards { display: flex; gap: 8px; margin-bottom: 12px; }
    .color-card { flex: 1; border-radius: 14px; overflow: hidden; border: 1px solid #F0F0F0; }
    .color-swatch { height: 44px; }
    .color-info { padding: 8px 10px; background: #fff; }
    .color-info .cname { font-size: 11px; font-weight: 700; color: #1a1a1a; }
    .color-info .crole { font-size: 10px; color: #aaa; margin-top: 1px; }
    .color-info .chex { font-size: 11px; font-family: monospace; color: #444; margin-top: 6px; }
    .color-info .crgb { font-size: 10px; font-family: monospace; color: #999; }
    .note { border-radius: 14px; padding: 10px 12px; font-size: 12px; }
    .note.amber { background: #fffbeb; color: #b45309; }
    .note.blue { background: #eff6ff; color: #2563eb; }
    .note.gray { background: #f9f9f9; border: 1px solid #f0f0f0; color: #777; }

    .ci-placeholder {
      border-radius: 14px;
      background: #f7f7f7;
      border: 1.5px dashed #ddd;
      height: 88px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      margin-bottom: 10px;
    }
    .ci-logo { display: flex; align-items: center; gap: 8px; }
    .ci-badge {
      width: 28px; height: 28px; border-radius: 8px;
      background: #00913A; color: white;
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .ci-logo span { font-size: 14px; font-weight: 700; color: #1a1a1a; }
    .ci-placeholder p { font-size: 11px; color: #bbb; }
    .ci-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .ci-grid-item {
      display: flex; align-items: center; gap: 8px;
      background: #f7f7f7; border-radius: 12px; padding: 10px 12px;
    }
    .ci-dot { width: 7px; height: 7px; border-radius: 50%; background: #00913A; flex-shrink: 0; }
    .ci-grid-item span { font-size: 12px; color: #444; }
    .dl-btn {
      width: 100%; padding: 12px;
      border-radius: 14px; border: none;
      background: #00913A; color: white;
      font-size: 13px; font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: opacity 0.2s;
    }
    .dl-btn:hover { opacity: 0.88; }

    .typo-list { background: #f7f8fa; border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px; }
    .typo-row { display: flex; align-items: center; justify-content: space-between; }
    .typo-meta { font-size: 10px; color: #aaa; margin-bottom: 2px; }
    .typo-tag {
      font-size: 11px; color: #aaa;
      background: white; border: 1px solid #f0f0f0;
      border-radius: 8px; padding: 3px 8px;
    }

    .icon-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 6px; margin-bottom: 10px; }
    .icon-cell {
      aspect-ratio: 1; border-radius: 10px;
      background: #f7f8fa; border: 1px solid #f0f0f0;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; cursor: pointer; transition: background 0.15s;
    }
    .icon-cell:hover { background: #e8f5ee; }
    .icon-rules { background: #f7f8fa; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .icon-rule { display: flex; gap: 10px; }
    .icon-rule-key { font-size: 11px; font-weight: 600; color: #aaa; width: 36px; flex-shrink: 0; padding-top: 1px; }
    .icon-rule-val { font-size: 12px; color: #555; line-height: 1.5; }

    .ppt-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .ppt-item {
      display: flex; align-items: center; gap: 12px;
      background: #f7f8fa; border: 1px solid #f0f0f0;
      border-radius: 14px; padding: 12px 14px; cursor: pointer;
      transition: background 0.15s;
    }
    .ppt-item:hover { background: #e8f5ee; }
    .ppt-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: #e8f5ee; display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .ppt-name { font-size: 13px; font-weight: 600; color: #1a1a1a; display: flex; align-items: center; gap: 6px; }
    .ppt-tag {
      font-size: 10px; padding: 2px 6px; border-radius: 999px;
      background: #00913A; color: white;
    }
    .ppt-desc { font-size: 11px; color: #aaa; margin-top: 2px; }
    .ppt-arrow { margin-left: auto; color: #ccc; font-size: 16px; flex-shrink: 0; }
    .path-box { background: #f9f9f9; border: 1px solid #f0f0f0; border-radius: 14px; padding: 10px 12px; }
    .path-box p { font-size: 11px; color: #777; line-height: 1.7; }
    .path-box code { font-family: monospace; font-size: 11px; color: #444; }

    /* ── Keyframes ── */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <button class="header-btn" id="back-btn" onclick="goBack()">&#8249;</button>
    <div class="header-title">DB손해보험 디자인 봇 <span>Beta</span></div>
    <button class="header-btn">&#9432;</button>
  </div>

  <!-- Intro Screen -->
  <div class="screen" id="intro-screen">
    <div class="greeting">
      <h2>반가워요,<br>디자인 봇이에요!<br>무엇을 도와드릴까요?</h2>
    </div>
    <div class="faq-list" id="faq-list"></div>
  </div>

  <!-- Chat Screen -->
  <div class="screen" id="chat-screen">
    <div class="messages" id="messages"></div>
    <div class="chip-bar">
      <p>다른 질문도 해보세요</p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

</div>

<script>
  const G = '#00913A';

  const faqs = [
    { id: 1, icon: '🎨', label: 'DB그린 컬러 알려주세요',       answer: 'color'  },
    { id: 2, icon: '⬇️', label: 'DB손해보험 CI 이미지가 필요해요', answer: 'ci'     },
    { id: 3, icon: '🔤', label: '타이포그래피 규칙을 알려주세요', answer: 'typo'   },
    { id: 4, icon: '✦',  label: '아이콘 시스템 가이드',          answer: 'icon'   },
    { id: 5, icon: '📋', label: 'PPT 템플릿 다운로드',           answer: 'ppt'    },
  ];

  const answers = {
    color: `
      <div class="ans">
        <p class="desc">DB손해보험 공식 브랜드 컬러입니다. 모든 채널에서 일관되게 사용해 주세요.</p>
        <div class="color-cards">
          <div class="color-card">
            <div class="color-swatch" style="background:#00913A"></div>
            <div class="color-info">
              <div class="cname">DB Green</div><div class="crole">Primary</div>
              <div class="chex">#00913A</div><div class="crgb">rgb(0, 145, 58)</div>
            </div>
          </div>
          <div class="color-card">
            <div class="color-swatch" style="background:#1A1A1A"></div>
            <div class="color-info">
              <div class="cname">DB Black</div><div class="crole">Secondary</div>
              <div class="chex">#1A1A1A</div><div class="crgb">rgb(26, 26, 26)</div>
            </div>
          </div>
          <div class="color-card">
            <div class="color-swatch" style="background:#E8F5EE"></div>
            <div class="color-info">
              <div class="cname">Light Green</div><div class="crole">Background</div>
              <div class="chex">#E8F5EE</div><div class="crgb">rgb(232, 245, 238)</div>
            </div>
          </div>
        </div>
        <div class="note amber">HEX 값을 임의로 변형하지 않도록 주의해 주세요.</div>
      </div>`,

    ci: `
      <div class="ans">
        <p class="desc">CI 사용 전 반드시 브랜드팀 검토를 받아야 합니다.</p>
        <div class="ci-placeholder">
          <div class="ci-logo">
            <div class="ci-badge">DB</div>
            <span>DB손해보험</span>
          </div>
          <p>Logo Placeholder</p>
        </div>
        <div class="ci-grid">
          ${['가로형 (기본)','세로형','심볼 단독','흰색 반전'].map(t=>`
            <div class="ci-grid-item"><div class="ci-dot"></div><span>${t}</span></div>`).join('')}
        </div>
        <button class="dl-btn">⬇ CI 패키지 다운로드</button>
      </div>`,

    typo: `
      <div class="ans">
        <p class="desc">공식 서체는 <strong>Noto Sans KR</strong>입니다.</p>
        <div class="typo-list">
          ${[
            {w:700, label:'Bold · 20px', sample:'디자인 시스템', sz:17, use:'제목'},
            {w:600, label:'SemiBold · 16px', sample:'디자인 시스템', sz:15, use:'서브타이틀'},
            {w:400, label:'Regular · 14px', sample:'디자인 시스템', sz:13, use:'본문'},
            {w:300, label:'Light · 12px', sample:'디자인 시스템', sz:12, use:'캡션'},
          ].map(r=>`
            <div class="typo-row">
              <div><div class="typo-meta">${r.label}</div>
              <div style="font-weight:${r.w};font-size:${r.sz}px;color:#1a1a1a">${r.sample}</div></div>
              <div class="typo-tag">${r.use}</div>
            </div>`).join('')}
        </div>
        <div class="note blue">영문 병용 시 <strong>Inter</strong> 사용 / 최소 본문 14px</div>
      </div>`,

    icon: `
      <div class="ans">
        <p class="desc">아이콘은 Outlined 스타일을 기본으로 사용합니다.</p>
        <div class="icon-grid">
          ${['🏠','📱','🛡️','📋','💳','🔔','📊','🔍','✅','⚙️','📞','🎯']
            .map(i=>`<div class="icon-cell">${i}</div>`).join('')}
        </div>
        <div class="icon-rules">
          ${[['크기','16 / 20 / 24 / 32px (4pt 그리드)'],
             ['스타일','Outlined 기본, Filled는 강조 시만'],
             ['색상','DB Green 또는 Gray-700 단색'],
             ['여백','아이콘 크기의 25% 이상']].map(([k,v])=>`
            <div class="icon-rule">
              <div class="icon-rule-key">${k}</div>
              <div class="icon-rule-val">${v}</div>
            </div>`).join('')}
        </div>
      </div>`,

    ppt: `
      <div class="ans">
        <p class="desc">사내 표준 PPT 템플릿은 아래 경로에서 받을 수 있어요.</p>
        <div class="ppt-list">
          ${[
            {name:'경영 보고용', desc:'임원·이사회 보고 전용', tag:'최신'},
            {name:'업무 협업용', desc:'부서 간 협업, 회의 자료', tag:null},
            {name:'외부 제안용', desc:'고객사·파트너 대상', tag:'신규'},
          ].map(p=>`
            <div class="ppt-item">
              <div class="ppt-icon">📄</div>
              <div>
                <div class="ppt-name">${p.name}${p.tag?`<span class="ppt-tag">${p.tag}</span>`:''}</div>
                <div class="ppt-desc">${p.desc}</div>
              </div>
              <div class="ppt-arrow">›</div>
            </div>`).join('')}
        </div>
        <div class="path-box">
          <p>📁 <code>\\\\intranet\\brand\\templates\\PPT</code></p>
          <p>외부 배포 시 브랜드팀 사전 승인 필요</p>
        </div>
      </div>`,
  };

  const used = new Set();
  let chatActive = false;

  /* ── Build intro ── */
  const faqList = document.getElementById('faq-list');
  faqs.forEach((f, i) => {
    const btn = document.createElement('button');
    btn.className = 'faq-btn';
    btn.innerHTML = `<span class="icon">${f.icon}</span><span class="label">${f.label}</span>`;
    btn.style.animationDelay = `${0.2 + i * 0.08}s`;
    btn.addEventListener('click', () => handleFaq(f));
    faqList.appendChild(btn);
    requestAnimationFrame(() => btn.classList.add('animate-in'));
  });

  /* ── Build chips ── */
  const chipsEl = document.getElementById('chips');
  faqs.forEach(f => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.id = `chip-${f.id}`;
    chip.innerHTML = `<span>${f.icon}</span><span>${f.id}번</span>`;
    chip.addEventListener('click', () => handleFaq(f));
    chipsEl.appendChild(chip);
  });

  function handleFaq(f) {
    if (used.has(f.id)) return;
    used.add(f.id);

    // Switch to chat
    if (!chatActive) {
      chatActive = true;
      document.getElementById('intro-screen').style.display = 'none';
      const cs = document.getElementById('chat-screen');
      cs.style.display = 'flex';
    }

    addMessage('user', f.label);
    setTimeout(() => addMessage('bot', null, f.answer), 300);

    // Mark chip used
    const chip = document.getElementById(`chip-${f.id}`);
    if (chip) chip.classList.add('used');
  }

  function addMessage(type, text, answerKey) {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = `msg-row ${type}`;

    if (type === 'bot') {
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = '🤖';
      row.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (type === 'user') {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = answers[answerKey] || '';
    }
    row.appendChild(bubble);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function goBack() {
    if (!chatActive) return;
    chatActive = false;
    document.getElementById('chat-screen').style.display = 'none';
    document.getElementById('intro-screen').style.display = '';
  }
</script>
</body>
</html>
